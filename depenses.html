<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dépenses - ComptaInf</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Segoe UI',sans-serif;
            background:#f4f6fb;
            padding:30px;
        }

        .header{
            display:flex;
            justify-content:space-between;
            align-items:center;

            margin-bottom:25px;
        }

        .panel{

            background:white;

            border-radius:20px;

            padding:25px;

            box-shadow:0 3px 15px rgba(0,0,0,.05);
        }

        .btn{

            background:#1976D2;

            color:white;

            text-decoration:none;

            padding:12px 18px;

            border-radius:12px;
        }

        .btn:hover{

            background:#115293;
        }

        .cards{

            display:flex;

            gap:20px;

            margin-bottom:25px;
        }

        .card{

            flex:1;

            background:white;

            border-radius:20px;

            padding:20px;

            box-shadow:0 3px 15px rgba(0,0,0,.05);
        }

        .card-title{

            color:#777;

            margin-bottom:8px;
        }

        .card-value{

            font-size:30px;

            font-weight:bold;

            color:#D32F2F;
        }

        .search{

            width:100%;

            margin-bottom:20px;

            padding:12px;

            border:1px solid #ddd;

            border-radius:10px;
        }

        table{

            width:100%;

            border-collapse:collapse;
        }

        th{

            background:#f7f9fc;

            text-align:left;

            padding:12px;
        }

        td{

            padding:12px;

            border-bottom:1px solid #eee;
        }

        tr:hover{

            background:#f9fbff;
        }

        .pdf-link{

            color:#1976D2;

            text-decoration:none;

            font-weight:600;
        }

        .pdf-link:hover{

            text-decoration:underline;
        }

    </style>

</head>

<body>

    <div class="header">

        <h1 id="pageTitle">
		🧾 Dépenses
		</h1>

        <a href="/">
            ← Retour au tableau de bord
        </a>

    </div>

    <div class="cards">

        <div class="card">

            <div class="card-title">
                Total dépenses
            </div>

            <div
                id="totalDepenses"
                class="card-value">

                0 CHF

            </div>

        </div>

        <div class="card">

            <div class="card-title">
                Nombre de dépenses
            </div>

            <div
                id="nbDepenses"
                class="card-value">

                0

            </div>

        </div>

    </div>

    <div class="panel">

        <input
            type="text"
            id="search"
            class="search"
            placeholder="🔍 Rechercher un fournisseur...">

        <table>

            <thead>

                <tr>
                    <th>Date</th>
                    <th>Fournisseur</th>
                    <th>Catégorie</th>
					<th>Compte</th>
                    <th>Montant</th>
                    <th>PDF</th>
                </tr>

            </thead>

            <tbody id="depensesBody">

            </tbody>

        </table>

    </div>

    <script>

        let allRows = [];

        async function loadDepenses() {

            const response =
                await fetch("/api/depenses");

            allRows =
                await response.json();

            renderDepenses();

            refreshStats();
        }

        function renderDepenses() {

            const filtre =
                document
                .getElementById("search")
                .value
                .toLowerCase();

            const tbody =
                document
                .getElementById(
                    "depensesBody"
                );

            tbody.innerHTML = "";

            allRows
            .slice(1)
            .reverse()
            .forEach(row => {

                const fournisseur =
                    (row[1] || "")
                    .toLowerCase();

                if(
                    filtre &&
                    !fournisseur.includes(
                        filtre
                    )
                ){
                    return;
                }

                const pdfLink =
                    row[5]
                    ? `
                        <a href="${row[5]}"
                           target="_blank"
                           class="pdf-link"
                           title="Ouvrir le justificatif">
                           📄 Voir
                        </a>
                    `
                    : "—";

                const tr =
                    document.createElement(
                        "tr"
                    );

                tr.innerHTML = `
                    <td>${row[0] || ""}</td>
                    <td>${row[1] || ""}</td>
                    <td>${row[2] || ""}</td>
					<td>${row[3] || ""}</td>
                    <td>${row[4] || ""} CHF</td>
                    <td>${pdfLink}</td>
                `;

                tbody.appendChild(tr);

            });

        }

        function refreshStats() {

            let total = 0;

            allRows
            .slice(1)
            .forEach(row => {

                total +=
                    parseFloat(
                        row[3]
                    ) || 0;

            });

            document
            .getElementById(
                "totalDepenses"
            )
            .innerHTML =
                total.toFixed(2) +
                " CHF";

            document
            .getElementById(
                "nbDepenses"
            )
            .innerHTML =
                allRows.length - 1;

        }

        document
        .getElementById(
            "search"
        )
        .addEventListener(
            "input",
            renderDepenses
        );

        loadDepenses();
		
		async function loadSettings(){
		
			const response =
				await fetch("/settings");
		
			const settings =
				await response.json();
		
			document.getElementById(
				"pageTitle"
			).innerHTML =
				`🧾 Dépenses - Exercice ${settings.exercice}`;
		}
		
		loadSettings();		
		

    </script>

</body>

</html>
