<!--share.html-->
<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">

  <title>Justificatif - ComptaInf</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f7f8;
      color: #1f2937;
    }

    main {
      max-width: 500px;
      margin: 40px auto;
      padding: 24px;
      text-align: center;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 28px 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    .logo {
      width: 96px;
      border-radius: 20px;
      margin-bottom: 15px;
    }

    #filename {
      font-weight: bold;
      margin: 25px 0;
      word-break: break-word;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 15px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #168c8c;
      color: white;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
    }

    .btn-cancel {
      background: #6c757d;
    }

    button:disabled {
      opacity: 0.5;
    }

    #status {
      margin-top: 18px;
    }
  </style>

</head>

<body>
  <script src="/utils/utils.js"></script>

  <main>
    <div class="card">

      <img src="/icon-192.png" class="logo" alt="ComptaInf">

      <!--<h1>ComptaInf</h1>-->
      <h2>Nouveau justificatif</h2>

      <div id="filename">
        Chargement du document…
      </div>

      <div id="status"></div>

    </div>
  </main>

  <script>

    const frames = [
      "📄 Lecture du justificatif",
      "🔍 Analyse du document",
      "🧠 Identification du fournisseur",
      "💰 Recherche du montant",
      "📆 Détection de la date"
    ];


    async function chargerFichier() {
      try {
        const check = await fetch("/google-status");

        if (check.status === 401) {
          console.log("processNextFile chargerFichier");

          window.location.href = "/login";

        }

        const response = await fetch("/api/shared-file");

        if (!response.ok) {
          throw new Error("Aucun fichier en attente");
        }

        const file = await response.json();

        document.getElementById("filename").textContent =
          "📎 " + file.originalname;

        // document.getElementById("analyseBtn").disabled = false;
        document.getElementById("status").textContent = "";
        //"🔎 Analyse du justificatif en cours…";

        await analyserFichier();

      } catch (error) {
        document.getElementById("filename").textContent =
          "Aucun justificatif en attente";

        document.getElementById("status").textContent =
          "Retourne dans Android et partage à nouveau le document vers ComptaInf.";
      }
    }

    async function analyserFichier() {

      const status = document.getElementById("status");
      let ii = 0;
      const animation = setInterval(() => {

        status.textContent =
          frames[ii++ % frames.length];
      }, 1000);

      try {


        const response = await fetch("/api/analyse-shared-file", {
          method: "POST"
        });

        const data = await response.json();
        clearInterval(animation);

        if (!response.ok) {
          throw new Error(data.error || "Erreur pendant l'analyse");
        }


        const isRealCEESV =
          data.ceesv &&
          (
            data.ceesv?.montantFacture ||
            data.ceesv?.montantEtat ||
            data.ceesv?.montantBanque
          );


        if (data.ceesv?.type === "CEESV_ETAT") {
          const matchResponse = await fetch("/findCEESVMatch", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ ceesv: data.ceesv })
          });
          data.ceesv.match = await matchResponse.json();
          data.ceesv.matchFacture = {
            trouve: data.ceesv.match.matchFacture,
            ligne: data.ceesv.match.ligneFacture,
            pdfUrl: data.ceesv.match.pdfFacture
          };
          data.ceesv.matchEtat = {
            trouve: data.ceesv.match.matchEtat,
            ligne: data.ceesv.match.ligneEtat,
            pdfUrl: data.ceesv.match.pdfEtat
          };
        } else if (data.ceesv?.type === "CEESV_UBS") {
          const matchResponse = await fetch("/findUBSMatch", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ ceesv: data.ceesv })
          });
          data.ceesv.match = await matchResponse.json();
        }

        window.sharedAnalyse = data;

        const date = data.date || data.ceesv?.dateValeur || "";
        console.log("share call api/checkDuplicate", date);

        const duplicateResponse =
          await fetch("/api/checkDuplicate", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              date: convertDate(date),
              fournisseur: data.fournisseur,
              categorie: data.categorie,
              montant: data.montant,
              montantEtat: data.ceesv?.montantFacture,
              montantFacture: data.ceesv?.montantEtat,
              montantBanque: data.ceesv?.montantBanque
            })
          });

        const duplicate =
          await duplicateResponse.json();

        //console.log(duplicate);

        status.innerHTML = `
      
    <p><strong>Type :</strong> ${data.type || "-"}</p>
    <p><strong>Fournisseur :</strong> ${data.fournisseur || "-"}</p>
    <p><strong>Categorie :</strong> ${data.categorie || "-"} / ${data.compte || "-"}</p>
    <p><strong>Date :</strong> ${data.date || "-"}</p>
    <p><strong>Montant :</strong> ${data.montant || "-"}</p>
    <div id="ceesvInfo"></div>
 `;


        if (isRealCEESV) {
          const ceesvHtml = data.ceesv.type === "CEESV_UBS"
            ? `
              <div class="ceesv-box">
                <div>🏦 <strong>Reçu UBS CEESV</strong></div>
                <div>Montant : <strong>${Number(data.ceesv.montantBanque || 0).toFixed(2)} CHF</strong></div>
                <div>Date de valeur : <strong>${data.ceesv.dateValeur || "-"}</strong></div>
                ${data.ceesv.match?.trouve
                  ? `✅ Ligne CEESV trouvée (${data.ceesv.match.fournisseur || ""}, ligne ${data.ceesv.match.ligne || "-"})`
                  : "⏳ Aucune ligne CEESV correspondante"}
              </div>`
            : `
              <div class="ceesv-box">
                <div>
                  🧾 Facturé : <strong>${Number(data.ceesv?.montantFacture || 0).toFixed(2)} CHF</strong>
                  ${data.ceesv?.matchFacture?.trouve
                    ? " <span style=\"color:#28a745;font-weight:bold;\">✅ UBS trouvé</span>"
                    : " <span style=\"color:#f39c12;font-weight:bold;\">⏳ UBS en attente</span>"}
                </div>
                <div style="margin-top:8px;">
                  🏛 Etat : <strong>${Number(data.ceesv?.montantEtat || 0).toFixed(2)} CHF</strong>
                  ${data.ceesv?.matchEtat?.trouve
                    ? " <span style=\"color:#28a745;font-weight:bold;\">✅ UBS trouvé</span>"
                    : " <span style=\"color:#f39c12;font-weight:bold;\">⏳ UBS en attente</span>"}
                </div>
                <div style="margin-top:8px;">📋 Factures : <strong>${data.ceesv?.nbFactures || 0}</strong></div>
              </div>`;

          document.getElementById("ceesvInfo").innerHTML = ceesvHtml;
        }
        //console.log(duplicate);
        if (duplicate.duplicate) {

          window.sharedAnalyse.duplicateRow =
            duplicate.row;
          window.sharedAnalyse.duplicateRows =
            duplicate.rowsCeesv;



          status.innerHTML += `
        <div style="color:orange">
            ⚠️ Doublon détecté
        </div>

        <button
            style="margin-top:10px"
            onclick="importerAnalyse('insert')">
            ➕ Importer quand même
        </button>

        <button
            style="margin-top:10px"
            onclick="modifAvantImport()">
            ➕ Modifier
        </button>

        <button
            style="margin-top:10px"
            onclick="importerAnalyse('replace')">
            ♻️ Remplacer
        </button>

        <button
            style="
                margin-top:10px;
                background:#dc3545;
            "
            onclick="annulerImport()">
            ❌ Annuler
        </button>
    `;

        } else {

          status.innerHTML += `
        <!--<div style="color:green">
            ✅ Aucun doublon détecté
        </div>-->


              <button
        id="importBtn"
        style="margin-top:20px;"
        onclick="importerAnalyse('insert')">
        ✅ Importer
      </button>

              <button
            style="margin-top:10px"
            onclick="modifAvantImport()">
            ➕ Modifier
        </button>

              <button
            style="
                margin-top:10px;
                background:#dc3545;
            "
            onclick="annulerImport()">
            ❌ Annuler
        </button>

    `;




        }
      } catch (error) {
        status.textContent = "❌ " + error.message;
        //btn.disabled = false;
      }
    };

    chargerFichier();

    async function importerAnalyse(mode) {

      window.sharedAnalyse.mode = mode;

      const loader =
        document.getElementById("loader");

      loader.style.display = "flex";

      try {

        //console.log("window.sharedAnalyse", JSON.stringify(window.sharedAnalyse));

        let response = null;
        // Import CEESV automatique
        if (window.sharedAnalyse.ceesv?.type === "CEESV_ETAT" || window.sharedAnalyse.ceesv?.type === "CEESV_UBS") {

          console.log("Import CEESV automatique");
          response = await fetch("/api/processCEESV", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              analyse: window.sharedAnalyse,
              mode
            })
          });

        } else {

          console.log("Import automatique");
          response =
            await fetch(
              "/addDepenseAndImport",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify(window.sharedAnalyse)
              }
            );

        }

        console.log("Import response=", response.ok);

        if (response.ok) {
          await fetch('/api/clear-session', { method: 'POST' });
        }

        window.location.href = "/";

      } catch (err) {

        alert(err.message);

      } finally {

        // sera exécuté uniquement si on reste sur la page
        loader.style.display = "none";

      }

    }

    async function processCEESV(data) {

      try {


        console.log("function processCEESV share", data);


        const response = await fetch("/api/processCEESV", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(data)
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || "Erreur CEESV");
        }

        // si l'API renvoie des valeurs modifiées
        Object.assign(data, result);

        return true;

      } catch (err) {

        alert("❌ CEESV : " + err.message);
        return false;
      }
    }

    async function modifAvantImport() {
      sessionStorage.setItem("editSharedAnalyse", JSON.stringify(window.sharedAnalyse));
      window.location.href = "/?editShared=1";
    }

    async function annulerImport() {

      await fetch('/api/clear-session', { method: 'POST' });

      window.location.href = "/";
    }

  </script>


  <div id="loader" style="
        display:none;
        position:fixed;
        inset:0;
        background:rgba(255,255,255,.8);
        z-index:9999;
        justify-content:center;
        align-items:center;
        font-size:24px;
     ">
    ⏳ Import en cours...
  </div>


</body>

</html>
