<!--share.html-->
<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">

  <title>Justificatif - ComptaInf</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f7f8;
      color: #1f2937;
    }

    main {
      max-width: 500px;
      margin: 40px auto;
      padding: 24px;
      text-align: center;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 28px 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    .logo {
      width: 96px;
      border-radius: 20px;
      margin-bottom: 15px;
    }

    #filename {
      font-weight: bold;
      margin: 25px 0;
      word-break: break-word;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 15px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #168c8c;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
    }

    #status {
      margin-top: 18px;
    }
  </style>
</head>

<body>

  <main>
    <div class="card">

      <img src="/icon-192.png" class="logo" alt="ComptaInf">

      <h1>ComptaInf</h1>
      <h2>Nouveau justificatif</h2>

      <div id="filename">
        Chargement du document…
      </div>

      <div id="status"></div>

    </div>
  </main>

  <script>
    async function chargerFichier() {
      try {

        const check = await fetch("/google-status");

        if (check.status === 401) {

          window.location.href = "/login";

        }

        const response = await fetch("/api/shared-file");

        if (!response.ok) {
          throw new Error("Aucun fichier en attente");
        }

        const file = await response.json();

        document.getElementById("filename").textContent =
          "📎 " + file.originalname;

        // document.getElementById("analyseBtn").disabled = false;
        document.getElementById("status").textContent =
          "🔎 Analyse du justificatif en cours…";

        await analyserFichier();

      } catch (error) {
        document.getElementById("filename").textContent =
          "Aucun justificatif en attente";

        document.getElementById("status").textContent =
          "Retourne dans Android et partage à nouveau le document vers ComptaInf.";
      }
    }



    //document.getElementById("analyseBtn").addEventListener("click", async () => {
    async function analyserFichier() {
      //const btn = document.getElementById("analyseBtn");
      const status = document.getElementById("status");

      //btn.disabled = true;
      status.textContent = "🔎 Analyse du justificatif en cours…";

      try {
        const response = await fetch("/api/analyse-shared-file", {
          method: "POST"
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Erreur pendant l'analyse");
        }

        window.sharedAnalyse = data;

        status.innerHTML = `
      
    <p><strong>Type :</strong> ${data.type || "-"}</p>
    <p><strong>Fournisseur :</strong> ${data.fournisseur || "-"}</p>
    <p><strong>Date :</strong> ${data.dates?.[0] || "-"}</p>
    <p><strong>Montant :</strong> ${data.montants?.[0] || "-"}</p>
 

      <button
        id="importBtn"
        style="margin-top:20px;"
        onclick="importerAnalyse()">
        ✅ Importer
      </button>
`;

      } catch (error) {
        status.textContent = "❌ " + error.message;
        //btn.disabled = false;
      }
    };

    chargerFichier();

    /*
        function importerAnalyse() {
    
          sessionStorage.setItem(
            "sharedAnalyse",
            JSON.stringify(window.sharedAnalyse)
          );
          alert("sharedAnalyse session set ");
          window.location.href = "/";
    
        }
    */
    async function importerAnalyse() {

      const response =
        await fetch(
          "/api/import-shared-file",
          {
            method: "POST"
          }
        );

      const result =
        await response.json();

      window.sharedAnalyse.pdfUrl =
        result.pdfUrl;

      sessionStorage.setItem(
        "sharedAnalyse",
        JSON.stringify(window.sharedAnalyse)
      );

      window.location.href = "/";
    }

  </script>

</body>

</html>
