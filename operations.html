<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dépenses - ComptaInf</title>

    <script>

        const params =
            new URLSearchParams(
                window.location.search
            );

        const pageType =
            params.get("type") || "depenses";

    </script>


    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f4f6fb;
            padding: 30px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 25px;
        }

        .panel {

            background: white;

            border-radius: 20px;

            padding: 25px;

            box-shadow: 0 3px 15px rgba(0, 0, 0, .05);
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            padding: 12px 20px;

            background: linear-gradient(90deg,
                    #1976D2,
                    #42a5f5);

            color: white;
            text-decoration: none;

            border-radius: 14px;
            font-weight: 600;

            box-shadow: 0 3px 12px rgba(25, 118, 210, 0.25);
            transition: all .2s ease;
        }

        .btn-back:hover {
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(25, 118, 210, 0.35);
        }

        .btn-back:active {
            transform: translateY(0);
        }

        .btn {

            background: #1976D2;

            color: white;

            text-decoration: none;

            padding: 12px 18px;

            border-radius: 12px;
        }

        .btn:hover {

            background: #115293;
        }

        .cards {

            display: flex;

            gap: 20px;

            margin-bottom: 25px;
        }

        .card {

            flex: 1;

            background: white;

            border-radius: 20px;

            padding: 20px;

            box-shadow: 0 3px 15px rgba(0, 0, 0, .05);
        }

        .card-title {

            color: #777;

            margin-bottom: 8px;
        }

        .card-value {

            font-size: 30px;

            font-weight: bold;

            color: #D32F2F;
        }

        .search {

            width: 100%;

            margin-bottom: 20px;

            padding: 12px;

            border: 1px solid #ddd;

            border-radius: 10px;
        }

        table {

            width: 100%;

            border-collapse: collapse;
        }

        th {

            background: #f7f9fc;

            text-align: left;

            padding: 12px;
        }

        td {

            padding: 12px;

            border-bottom: 1px solid #eee;
        }

        tr:hover {

            background: #f9fbff;
        }

        .pdf-link {

            color: #1976D2;

            text-decoration: none;

            font-weight: 600;
        }

        .pdf-link:hover {

            text-decoration: underline;
        }

        .montant-negatif {
            color: #D32F2F;
            font-weight: bold;
        }

        .montant-positif {
            color: #2E7D32;
            font-weight: bold;
        }

        .mois-separateur {
            padding: 0;
        }

        .mois-separateur>div {
            background: linear-gradient(90deg,
                    #1976D2,
                    #42a5f5);
            color: white;
            padding: 12px 16px;
            font-weight: bold;
        }
    </style>

</head>

<body>

    <div class="header">

        <h1 id="pageTitle">
            🧾 Dépenses
        </h1>

        <a href="/" class="btn-back">
            🏠 Tableau de bord
        </a>

    </div>

    <div class="cards">

        <div class="card">

            <div class="card-title">
                Total dépenses
            </div>

            <div id="totalDepenses" class="card-value">

                0 CHF

            </div>

        </div>

        <div class="card">

            <div class="card-title">
                Nombre de dépenses
            </div>

            <div id="nbDepenses" class="card-value">

                0

            </div>

        </div>

    </div>

    <div class="panel">

        <input type="text" id="search" class="search" placeholder="🔍 Rechercher un fournisseur...">

        <table>

            <thead>

                <tr>
                    <th>Date</th>
                    <th>Fournisseur</th>
                    <th>Catégorie</th>
                    <th>Compte</th>
                    <th>Montant</th>
                    <th>PDF</th>
                </tr>

            </thead>

            <tbody id="depensesBody">

            </tbody>

        </table>

    </div>

    <script>

        document.querySelector(
            ".card-title"
        ).innerHTML =
            pageType === "recettes"
                ? "Total recettes"
                : pageType === "depenses"
                    ? "Total dépenses"
                    : "Total mouvements";

        document.querySelectorAll(
            ".card-title"
        )[1].innerHTML =
            pageType === "recettes"
                ? "Nombre de recettes"
                : pageType === "depenses"
                    ? "Nombre de dépenses"
                    : "Nombre d'opérations";

        let allRows = [];

        async function loadDepenses() {

            const response =
                await fetch("/api/depenses");

            allRows =
                await response.json();

            renderOperations();

            refreshStats();
        }

        function renderOperations() {

            let dernierMois = "";
            const totauxParMois = {};
            const nbParMois = {};

            allRows
                .slice(1)
                .forEach(row => {

                    const montant =
                        Number(
                            String(row[4] || "0")
                                .replace(",", ".")
                        );

                    if (
                        pageType === "depenses" &&
                        montant >= 0
                    ) {
                        return;
                    }

                    if (
                        pageType === "recettes" &&
                        montant <= 0
                    ) {
                        return;
                    }


                    if (!row[0]) {
                        return;
                    }
                    const date = new Date(row[0]);

                    const mois =
                        date.toLocaleDateString(
                            "fr-FR",
                            {
                                month: "long",
                                year: "numeric"
                            }
                        );

                    if (!nbParMois[mois]) {
                        nbParMois[mois] = 0;
                    }

                    nbParMois[mois]++;


                    if (!totauxParMois[mois]) {
                        totauxParMois[mois] = 0;
                    }

                    totauxParMois[mois] +=
                        Math.abs(montant);

                });

            const filtre =
                document
                    .getElementById("search")
                    .value
                    .toLowerCase();

            const tbody =
                document
                    .getElementById(
                        "depensesBody"
                    );

            tbody.innerHTML = "";

            allRows
                .slice(1)
                .sort((a, b) => {

                    const dateA = new Date(a[0]);
                    const dateB = new Date(b[0]);

                    return dateB - dateA;

                })
                .forEach(row => {

                    const fournisseur =
                        (row[1] || "")
                            .toLowerCase();

                    if (
                        filtre &&
                        !fournisseur.includes(
                            filtre
                        )
                    ) {
                        return;
                    }

                    const pdfLink =
                        row[5]
                            ? `
                        <a href="${row[5]}"
                           target="_blank"
                           class="pdf-link"
                           title="Ouvrir le justificatif">
                           📄 Voir
                        </a>
                    `
                            : "—";

                    const tr =
                        document.createElement(
                            "tr"
                        );
                    const montant =
                        Number(
                            String(row[4] || "0")
                                .replace(",", ".")
                        );

                    if (
                        pageType === "depenses" &&
                        montant >= 0
                    ) {
                        return;
                    }

                    if (
                        pageType === "recettes" &&
                        montant <= 0
                    ) {
                        return;
                    }


                    const classeMontant =
                        montant < 0
                            ? "montant-negatif"
                            : "montant-positif";



                    const date =
                        new Date(row[0]);

                    const mois =
                        date.toLocaleDateString(
                            "fr-FR",
                            {
                                month: "long",
                                year: "numeric"
                            }
                        );

                    if (mois !== dernierMois) {

                        dernierMois = mois;

                        const trMois =
                            document.createElement("tr");

                        trMois.innerHTML = `
    <td colspan="6"
        class="mois-separateur">

        <div style="
            display:flex;
            justify-content:space-between;
            align-items:center;
            width:100%;
        ">

            <span>
                📅 ${mois.charAt(0).toUpperCase() + mois.slice(1)}
                (${nbParMois[mois]} opérations)
            </span>

            <span>
                ${totauxParMois[mois].toLocaleString(
                            "fr-FR",
                            {
                                minimumFractionDigits: 2,
                                maximumFractionDigits: 2
                            }
                        )} CHF
            </span>

        </div>

    </td>
`;


                        tbody.appendChild(trMois);

                    }

                    tr.innerHTML = `
                    <td>${row[0] || ""}</td>
                    <td>${row[1] || ""}</td>
                    <td>${row[2] || ""}</td>
					<td>${row[3] || ""}</td>
                    <td class="${classeMontant}">
    ${Math.abs(montant).toLocaleString(
                        "fr-FR",
                        {
                            minimumFractionDigits: 2,
                            maximumFractionDigits: 2
                        }
                    )} CHF
</td>
                    <td>${pdfLink}</td>
                `;

                    tbody.appendChild(tr);

                });

        }

        function refreshStats() {

            let total = 0;
            let nb = 0;

            allRows
                .slice(1)
                .forEach(row => {

                    const montant =
                        Number(
                            String(row[4] || "0")
                                .replace(",", ".")
                        );

                    if (
                        pageType === "depenses"
                    ) {

                        if (montant < 0) {

                            total += Math.abs(montant);
                            nb++;

                        }

                    }
                    else if (
                        pageType === "recettes"
                    ) {

                        if (montant > 0) {

                            total += montant;
                            nb++;

                        }

                    }
                    else {

                        total += Math.abs(montant);
                        nb++;

                    }

                });

            document.getElementById(
                "totalDepenses"
            ).innerHTML =
                total.toLocaleString(
                    "fr-FR",
                    {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    }
                ) + " CHF";

            document.getElementById(
                "nbDepenses"
            ).innerHTML = nb;

        }

        document
            .getElementById(
                "search"
            )
            .addEventListener(
                "input",
                renderOperations
            );

        loadDepenses();

        async function loadSettings() {

            const response =
                await fetch("/settings");

            const settings =
                await response.json();

            document.getElementById(
                "pageTitle"
            ).innerHTML =
                pageType === "recettes"
                    ? `💰 Recettes - Exercice ${settings.Exercice}`
                    : pageType === "depenses"
                        ? `🧾 Dépenses - Exercice ${settings.Exercice}`
                        : `📋 Mouvements - Exercice ${settings.Exercice}`;
        }

        loadSettings();


    </script>

</body>

</html>
