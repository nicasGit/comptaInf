<!-- operations.html -->

<div class="operations-container">

    <div class="header">

        <h1 id="pageTitle">
            🧾 Dépenses
        </h1>

        <!--<a href="/" class="btn-back">
            🏠 Tableau de bord
        </a>-->

    </div>

    <div class="cards">

        <div class="card">

            <div class="card-title">
                Total dépenses
            </div>

            <div id="totalDepenses" class="card-value green">

                0 CHF

            </div>

        </div>

        <div class="card">

            <div class="card-title">
                Nombre de dépenses
            </div>

            <div id="nbDepenses" class="card-value green">

                0

            </div>

        </div>

    </div>

    <div class="panel">

        <div class="search-box">
            <span>🔍</span>
            <input type="text" id="search" class="search" placeholder="Rechercher un fournisseur...">
        </div>

        <table id="depensesTable">

            <thead>

                <tr>
                    <th>Date</th>
                    <th>Fournisseur</th>
                    <th>Catégorie</th>
                    <th>Compte</th>
                    <th>Montant</th>
                    <th>PDF</th>
                </tr>

            </thead>

            <tbody id="depensesBody">

            </tbody>

        </table>

    </div>

</div>
