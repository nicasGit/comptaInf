<div class="page-header"><h2>Frais professionnels</h2></div>

<div class="professional-summary">
    <div class="card professional-summary-total"><span>Total professionnel</span><strong id="professionalTotal">0,00 CHF</strong></div>
    <div class="card professional-summary-count"><span>Dépenses</span><strong id="professionalCount">0</strong></div>
    <div class="card professional-summary-mileage"><span>Frais kilométriques</span><strong id="professionalMileage">0,00 CHF</strong></div>
    <div class="card professional-summary-missing"><span>Justificatifs manquants</span><strong id="professionalMissing">0</strong></div>
</div>

<div class="professional-tabs" role="tablist">
    <button class="professional-tab active" data-category="all">Toutes les dépenses</button>
    <button class="professional-tab" data-category="vehicle">Véhicule</button>
    <button class="professional-tab" data-category="medical">Matériel médical</button>
    <button class="professional-tab" data-category="pharmacy">Pharmacie</button>
    <button class="professional-tab" data-category="insurance">Assurances</button>
    <button class="professional-tab" data-category="training">Formation</button>
    <button class="professional-tab" data-category="telecom">Téléphonie</button>
    <button class="professional-tab" data-category="other">Autres</button>
</div>

<div class="card professional-category-card">
    <h3>Répartition par catégorie</h3>
    <div id="professionalCategories" class="professional-categories"></div>
</div>

<div class="card professional-table-card">
    <div class="professional-table-header">
        <h3>Dépenses professionnelles</h3>
        <input id="professionalSearch" type="search" placeholder="Rechercher un fournisseur...">
    </div>
    <div class="professional-table-wrapper">
        <table class="professional-table">
            <thead><tr><th>Date</th><th>Fournisseur</th><th>Catégorie</th><th>Justificatif</th><th class="professional-amount">Montant</th></tr></thead>
            <tbody id="professionalExpenses"></tbody>
        </table>
    </div>
</div>

<style>
